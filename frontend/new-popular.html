<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaStream - New & Popular</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/new_pop.css?v=2" />
</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <i class="fas fa-film logo-icon"></i>
                <h1>NOVA<span>STREAM</span></h1>
            </div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#" class="active">New & Popular</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">TV Shows</a></li>
                <li><a href="#">My List</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <i class="fas fa-search"></i>
            <i class="fas fa-bell"></i>
            <div class="profile">
                <img src="https://ui-avatars.com/api/?name=User&background=e50914&color=white&size=40" alt="Profile" />
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-container">

        <!-- Section 1: Top 10 Shows - PORTRAIT with BIG Numbers -->
        <section class="content-section">
            <div class="section-header">
                <h2>🔥 Top 10 Shows in India Today</h2>
            </div>
            <div class="scroll-container portrait" id="top10-shows"></div>
        </section>

        <!-- Section 2: New on NovaStream - LANDSCAPE with Badges -->
        <section class="content-section">
            <div class="section-header">
                <h2>✨ New on NovaStream</h2>
            </div>
            <div class="scroll-container landscape" id="new-on-novastream"></div>
        </section>

        <!-- Section 3: Coming This Week - LANDSCAPE Clean -->
        <section class="content-section">
            <div class="section-header">
                <h2>📅 Coming This Week</h2>
            </div>
            <div class="scroll-container landscape" id="coming-this-week"></div>
        </section>

        <!-- Section 4: Worth the Wait - LANDSCAPE Clean -->
        <section class="content-section">
            <div class="section-header">
                <h2>⏳ Worth the Wait</h2>
            </div>
            <div class="scroll-container landscape" id="worth-the-wait"></div>
        </section>

        <!-- Section 5: Coming Next Week - LANDSCAPE Clean -->
        <section class="content-section">
            <div class="section-header">
                <h2>📆 Coming Next Week</h2>
            </div>
            <div class="scroll-container landscape" id="coming-next-week"></div>
        </section>

        <!-- Section 6: Top 10 Movies - PORTRAIT with BIG Numbers -->
        <section class="content-section">
            <div class="section-header">
                <h2>🎬 Top 10 Movies in India Today</h2>
            </div>
            <div class="scroll-container portrait" id="top10-movies"></div>
        </section>

        <!-- Section 7: Most Popular TV Shows - LANDSCAPE Clean -->
        <section class="content-section">
            <div class="section-header">
                <h2>📈 Most Popular TV Shows</h2>
            </div>
            <div class="scroll-container landscape" id="popular-tvshows"></div>
        </section>

        <!-- Section 8: Most Popular Movies - LANDSCAPE Clean -->
        <section class="content-section">
            <div class="section-header">
                <h2>🎥 Most Popular Movies</h2>
            </div>
            <div class="scroll-container landscape" id="popular-movies"></div>
        </section>

    </div>

    <script src="js/new_pop.js?v=2"></script>
</body>

</html>
