<!DOCTYPE html>
<html lang="en">

<head>

                <ul class="nav-links">

                    <li><a href="series.html">Series</a></li>
                    <li><a href="new-popular.html">New &amp; Popular</a></li>
                    <li class="active"><a href="mylist.html">My List</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <a href="search-page.html" class="icon-btn" aria-label="Search">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

            <!-- ─── MOVIE GRID (dynamic) ─── -->
            <div id="myListMovies" class="mylist-grid"></div>

        </main>

    <!-- ─── TOAST ─── -->
    <div id="toast" class="toast">
        <span id="toastMsg">Added to My List ♥</span>
    </div>

    <script src="js/mylist.js"></script>
