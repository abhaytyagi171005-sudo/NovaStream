<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaStream — My List</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet" />
    <!-- ✅ FIXED: Correct CSS path (relative to frontend folder) -->
    <link rel="stylesheet" href="css/mylist.css" />
</head>

<body>

    <div class="page-bg"></div>
    <div id="bgCollage" class="bg-collage"></div>

    <div class="app">

        <!-- ─── NAVBAR ─── -->
        <nav class="navbar">
            <div class="nav-left">
                <a href="#" class="brand">NovaStream</a>
                <ul class="nav-links">
                    <li>Movies</li>
                    <li>Series</li>
                    <li>New &amp; Popular</li>
                    <li class="active">My List</li>
                </ul>
            </div>
            <div class="nav-right">
                <button class="icon-btn" aria-label="Search">&#128269;</button>
                <button class="icon-btn" aria-label="Notifications">&#128276;</button>
                <div class="avatar">N</div>
            </div>
        </nav>

        <!-- ─── MAIN ─── -->
        <main class="main">

            <div class="page-header">
                <h1>My List</h1>
                <div class="sub mylist-count">No movies saved yet</div>
            </div>

            <!-- ─── MOVIE GRID (dynamic) ─── -->
            <div id="myListMovies" class="mylist-grid"></div>

            <!-- ─── RECOMMENDATIONS ─── -->
            <section id="recsSection" style="display: none; margin-top: 3rem;">
                <h2
                    style="font-size: 1.6rem; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 1.5rem; background: linear-gradient(to right, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: inline-block;">
                    Because you watched…
                </h2>
                <div id="recsLoading" style="color: #8c8c8c; font-size: 1rem; padding: 1rem 0;">Finding recommendations…
                </div>
                <div id="recsList" class="recs-grid"></div>
            </section>

        </main>

    </div>

    <!-- ─── TOAST ─── -->
    <div id="toast" class="toast">
        <span id="toastMsg">Added to My List ♥</span>
    </div>

    <!-- ✅ FIXED: Correct JS path (relative to frontend folder) -->
    <script src="js/mylist.js"></script>
</body>

</html>
