<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaStream</title>

    <link rel="stylesheet" href="css/home.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- NAVBAR -->
    <nav>

        <div class="logo">

            <span class="logo-icon">▶</span>

            <h1>
                Nova<span>Stream</span>
            </h1>

        </div>

        <ul>
            <li class="active">Home</li>
            <li onclick="window.location.href='movies.html'">Movies</li>
            <li onclick="window.location.href='series.html'">Series</li>
            <li>New & Popular</li>
            <li onclick="window.location.href='mylist.html'">My List</li>
            <li onclick="window.location.href='search-page.html'">🔍 Search</li>
        </ul>

        <div class="nav-right">

        </div>

        <div class="profile">

            <span>A</span>

            <div class="dropdown">

                <p>Profile</p>
                <p>My List</p>
                <p>Settings</p>
                <p>Logout</p>

            </div>

        </div>

        </div>

    </nav>

    <!-- ─── HERO BANNER ─── -->
    <section class="hero" id="heroBanner">
        <div class="hero-slides" id="heroSlides">
            <!-- Slides will be injected by JavaScript -->
        </div>

        <!-- Hero controls (arrows) -->
        <div class="hero-controls">
            <button class="hero-btn hero-btn-left" id="heroPrev" aria-label="Previous">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>
            <button class="hero-btn hero-btn-right" id="heroNext" aria-label="Next">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </button>
        </div>

        <!-- Indicators (dots) -->
        <div class="hero-indicators" id="heroIndicators"></div>
    </section>

    <!-- ─── MOVIE ROWS ─── -->
    <section class="movies" id="sectionComedy">
        <h2>Comedy Collection</h2>
        <div class="movie-row" id="comedyMovies"></div>
    </section>

    <section class="movies" id="sectionDrama">
        <h2>Drama</h2>
        <div class="movie-row" id="dramaMovies"></div>
    </section>

    <section class="movies" id="sectionHorror">
        <h2>Horror Collection</h2>
        <div class="movie-row" id="horrorMovies"></div>
    </section>

    <section class="movies" id="sectionThriller">
        <h2>Thriller Collection</h2>
        <div class="movie-row" id="thrillerMovies"></div>
    </section>

    <section class="movies" id="sectionCrime">
        <h2>Crime Collection</h2>
        <div class="movie-row" id="crimeMovies"></div>
    </section>

    <section class="movies" id="sectionAnimation">
        <h2>Animation</h2>
        <div class="movie-row" id="animationMovies"></div>
    </section>

    <section class="movies" id="sectionAnime">
        <h2>Anime</h2>
        <div class="movie-row" id="animeMovies"></div>
    </section>

    <section class="movies" id="sectionFamily">
        <h2>Family</h2>
        <div class="movie-row" id="familyMovies"></div>
    </section>

    <section class="movies" id="sectionDocumentary">
        <h2>Documentary</h2>
        <div class="movie-row" id="documentaryMovies"></div>
    </section>

    <section class="movies" id="sectionRomance">
        <h2>Romance</h2>
        <div class="movie-row" id="romanceMovies"></div>
    </section>

    <div id="toast" class="toast">
        <span class="toast-icon">♥</span>
        <span id="toastMsg">Added to My List</span>
    </div>

    <!-- JS -->
    <script src="js/home.js"></script>
    <script>
        fetch("https://novastream-o3ri.onrender.com/api/test")
            .then(response => response.json())
            .then(data => {
                console.log(data);
            });
    </script>
    <script src="js/preview.js"></script>
</body>

</html>
