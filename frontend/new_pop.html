<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaStream - New & Popular</title>
    <link rel="stylesheet" href="new_pop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-left">
            <h1 class="logo">NOVASTREAM</h1>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#" class="active">New & Popular</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">TV Shows</a></li>
                <li><a href="#">My List</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <i class="fas fa-search"></i>
            <i class="fas fa-bell"></i>
            <div class="profile">
                <img src="https://ui-avatars.com/api/?name=User&background=red&color=white&size=32" alt="Profile">
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Section 1: Top 10 Shows in India Today -->
        <section class="content-section">
            <div class="section-header">
                <h2>Top 10 Shows in India Today</h2>
                <span class="badge">🔥</span>
            </div>
            <div class="scroll-container" id="top10-shows">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 2: New on NovaStream -->
        <section class="content-section">
            <div class="section-header">
                <h2>New on NovaStream</h2>
                <span class="badge">✨</span>
            </div>
            <div class="scroll-container" id="new-on-novastream">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 3: Coming This Week -->
        <section class="content-section">
            <div class="section-header">
                <h2>Coming This Week</h2>
                <span class="badge">📅</span>
            </div>
            <div class="scroll-container" id="coming-this-week">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 4: Worth the Wait -->
        <section class="content-section">
            <div class="section-header">
                <h2>Worth the Wait</h2>
                <span class="badge">⏳</span>
            </div>
            <div class="scroll-container" id="worth-the-wait">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 5: Upcoming Shows -->
        <section class="content-section">
            <div class="section-header">
                <h2>Upcoming Shows</h2>
                <span class="badge">📺</span>
            </div>
            <div class="scroll-container" id="upcoming-shows">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 6: Upcoming Movies -->
        <section class="content-section">
            <div class="section-header">
                <h2>Upcoming Movies</h2>
                <span class="badge">🎬</span>
            </div>
            <div class="scroll-container" id="upcoming-movies">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 7: Most Popular TV Shows -->
        <section class="content-section">
            <div class="section-header">
                <h2>Most Popular TV Shows</h2>
                <span class="badge">📈</span>
            </div>
            <div class="scroll-container" id="popular-tvshows">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>

        <!-- Section 8: Most Popular Movies -->
        <section class="content-section">
            <div class="section-header">
                <h2>Most Popular Movies</h2>
                <span class="badge">🎥</span>
            </div>
            <div class="scroll-container" id="popular-movies">
                <!-- Cards will be loaded by JavaScript -->
            </div>
        </section>
    </div>

    <script src="new_pop.js"></script>
</body>

</html>
