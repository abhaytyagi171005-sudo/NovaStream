name: Update Hero Banner

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# ─── ADD THESE PERMISSIONS ───
permissions:
  contents: write
  pull-requests: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install yt-dlp

      - name: Install Node dependencies
        run: |
          cd backend
          npm install

      - name: Run hero fetch script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cd backend
          npm run fetch-hero

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add frontend/images/hero-posters/ frontend/images/hero-previews/ frontend/data/heroMovies.json
          git commit -m "Update hero movies [skip ci]" || echo "No changes to commit"
          git push